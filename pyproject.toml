[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "js2pydantic"
version = "0.1.0"
description = "CLI and library to generate typed Pydantic models from JSON Schema and OpenAPI specs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "max", email = "you@example.com" },
]
keywords = ["json-schema", "pydantic", "openapi", "code-generator", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pydantic>=2.0.0",
    "pydantic[email]>=2.0.0",
    "jinja2>=3.1.0",
    "typer>=0.9.0",
    "black>=23.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "types-pyyaml",
]

[project.scripts]
js2pydantic = "js2pydantic.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/js2pydantic"
Repository = "https://github.com/yourusername/js2pydantic"
Issues = "https://github.com/yourusername/js2pydantic/issues"

[tool.hatch.build.targets.wheel]
packages = ["js2pydantic"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=js2pydantic --cov-report=term-missing --cov-report=xml"
